# Xiaozhi ESP32 Server Configuration
# Copy this file to xiaozhi-data/.config.yaml before starting the server.
#
# This config routes LLM requests through OpenClaw gateway,
# which provides multi-channel chat (WhatsApp, Telegram, Discord, etc.)
# and supports multiple AI backends (Claude, GPT, local models).

server:
  # WebSocket endpoint for ESP32 devices
  websocket: "ws://${SERVER_IP}:8000/xiaozhi/v1/"

  # OTA firmware update endpoint
  ota: "http://${SERVER_IP}:8003/xiaozhi/ota/"

# Route LLM through OpenClaw gateway (OpenAI-compatible API)
# This lets you use OpenClaw's AI agent, memory, and multi-channel features.
llm:
  type: openai
  base_url: "http://openclaw:18789/v1"
  api_key: "${OPENCLAW_PASSWORD}"
  model: "openclaw"

# ASR (Speech-to-Text) — use built-in or external service
# asr:
#   type: fun_asr    # Built-in FunASR (requires more resources)
#   # OR
#   type: openai_whisper
#   base_url: "https://api.openai.com/v1"
#   api_key: "${OPENAI_API_KEY}"

# TTS (Text-to-Speech) — configure your preferred provider
# tts:
#   type: edge_tts
#   voice: "vi-VN-HoaiMyNeural"  # Vietnamese voice
