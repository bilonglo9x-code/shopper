# Xiaozhi ESP32 Server — Minimal (Standalone) Configuration
#
# Use this ONLY for minimal (non-database) deployment.
# For full deployment with 智控台, use setup.sh which generates data/.config.yaml
#
# This config routes LLM requests through OpenClaw gateway,
# which provides multi-channel chat (WhatsApp, Telegram, Discord, etc.)
# and supports multiple AI backends (Claude, GPT, local models).

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003

# Route LLM through OpenClaw gateway (OpenAI-compatible API)
llm:
  type: openai
  base_url: "http://openclaw:18789/v1"
  api_key: "${OPENCLAW_PASSWORD}"
  model: "openclaw"

# ASR (Speech-to-Text)
# Option 1: Free — use Sherpa ONNX (built-in, offline, no API key needed)
# Option 2: FunASR (local model, requires ~2GB download)
# Option 3: External API (Whisper, Baidu, Tencent, etc.)
# asr:
#   type: fun_asr
#   # OR
#   type: openai_whisper
#   base_url: "https://api.openai.com/v1"
#   api_key: "${OPENAI_API_KEY}"

# TTS (Text-to-Speech)
# EdgeTTS is free and supports Vietnamese
tts:
  type: edge_tts
  voice: "vi-VN-HoaiMyNeural"   # Vietnamese female voice
  # Other Vietnamese voices: vi-VN-NamMinhNeural (male)
