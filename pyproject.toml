[project]
name = "shopper"
version = "0.1.0"
description = "Shopee data scraping tool with API server and affiliate link generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bilonglo9x" }]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ebooklib>=0.18",
    "html2text>=2024.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
shopper = "shopper.cli:app"
bookai = "shopper.bookai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopper"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
